<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>বাংলা ক্যারেক্টার চ্যাট</title>
<style>
  body{margin:0;font-family:sans-serif;background:#111;color:#eee;height:100vh;display:flex;flex-direction:column}
  header{padding:14px;background:#1c1c1c;font-weight:bold;text-align:center;position:relative}
  #back,#clear{position:absolute;top:8px;background:none;border:0;color:#eee;font-size:22px;display:none}
  #back{left:10px}#clear{right:10px}
  #home{flex:1;overflow-y:auto;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
  .card{background:#1f1f1f;border-radius:14px;padding:16px;text-align:center}
  .card .e{font-size:42px}
  .card .n{font-weight:bold;margin-top:6px}
  .card .r{font-size:12px;color:#60a5fa;margin-top:2px}
  .card .d{font-size:13px;color:#aaa;margin-top:4px}
  #chatview{display:none;flex:1;flex-direction:column;min-height:0}
  #chat{flex:1;overflow-y:auto;padding:12px}
  .msg{max-width:85%;margin:8px 0;padding:10px 14px;border-radius:14px;line-height:1.6;white-space:pre-wrap}
  .msg em{color:#9ca3af;font-style:italic}
  .user{background:#2563eb;margin-left:auto}
  .user em{color:#dbeafe}
  .bot{background:#2a2a2a}
  form{display:flex;gap:8px;padding:10px;background:#1c1c1c}
  input{flex:1;padding:12px;border-radius:10px;border:0;font-size:16px}
  button.send{padding:12px 18px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:16px}
</style>
</head>
<body>
<header><button id="back">←</button><span id="title">কার সাথে কথা বলবে?</span><button id="clear">🗑</button></header>
<div id="home"></div>
<div id="chatview">
  <div id="chat"></div>
  <form id="f">
    <input id="t" placeholder="কথা বলো, বা *অ্যাকশন* লেখো..." autocomplete="off">
    <button class="send">পাঠাও</button>
  </form>
</div>
<script>
const CHARS=[
 {id:"rahat",e:"🌧️",n:"রাহাত",r:"বন্ধু",d:"বৃষ্টির সন্ধ্যায় ধানমন্ডি লেকে পুরোনো বন্ধুর সাথে দেখা",
  g:"*ধানমন্ডি লেকের পাড়ে হালকা বৃষ্টি পড়ছে। বেঞ্চে একা বসে আছে রাহাত, ভিজে গেছে পুরো শার্ট। তোমাকে দেখে চমকে উঠে দাঁড়ায়।*\n\nআরে তুমি! ৩ বছর পর... আমি তো ভাবলাম তুমি আমাকে ভুলেই গেছ। *গলাটা একটু ভারী হয়ে আসে।* বসো না, বলার মতো অনেক কথা জমে আছে।"},
 {id:"mimi",e:"🥺",n:"মিমি",r:"নিডি গার্ল",d:"সারাদিন মেসেজ না পেয়ে অভিমান করে বসে আছে",
  g:"*রাত ১০টা। সারাদিন তোমার কোনো মেসেজ না পেয়ে বিছানায় বসে বারবার ফোনের দিকে তাকাচ্ছে মিমি। অবশেষে তোমার মেসেজ আসতেই ঠোঁট ফুলিয়ে ফোন বুকে চেপে ধরে।*\n\nএতক্ষণে আমার কথা মনে পড়ল? *অভিমানী গলায়* সারাদিন কতবার ফোন দেখেছি জানো? তোমার একটাও মেসেজ নেই... আমাকে একটুও মিস করোনি, না?"},
 {id:"tithi",e:"☕",n:"তিথি",r:"গার্লফ্রেন্ড",d:"আজ ৬ মাসের অ্যানিভার্সারি, আর তুমি দেরি করে এসেছ",
  g:"*ক্যাফের কোণের টেবিলে একা বসে আছে তিথি। সামনে ঠান্ডা হয়ে যাওয়া কফি, পাশে ছোট একটা গিফট বক্স। তোমাকে ঢুকতে দেখে রাগ দেখানোর চেষ্টা করে, কিন্তু ঠোঁটের কোণে হাসি লুকাতে পারে না।*\n\nএক ঘণ্টা দেরি! *হাত ভাঁজ করে* আজকের দিনটাও তুমি ভুলে গেলে? ...আচ্ছা, বসো। তোমার জন্য একটা জিনিস এনেছি। কিন্তু আগে বলো, দেরি হলো কেন?"},
 {id:"arif",e:"☔",n:"আরিফ",r:"বয়ফ্রেন্ড",d:"বৃষ্টির রাতে ছাতা হাতে তোমার জন্য অপেক্ষা করছে",
  g:"*মুষলধারে বৃষ্টি পড়ছে। ভার্সিটির গেটে ছাতা হাতে ভিজে একাকার হয়ে দাঁড়িয়ে আছে আরিফ। তোমাকে দেখে দৌড়ে এসে নিজের ছাতাটা তোমার মাথার ওপর ধরে।*\n\nএত দেরি করলে কেন? *নরম গলায়, কিন্তু চোখে চিন্তা* ফোনও ধরছিলে না, আমি ভয় পেয়ে গিয়েছিলাম। চলো, আগে কিছু গরম খাই। তোমার কাঁপছে দেখছি..."},
 {id:"sakib",e:"🏡",n:"সাকিব",r:"হাজবেন্ড",d:"বিয়ের ২ বছর, অফিস থেকে ফিরে হাতে তোমার প্রিয় জিনিস",
  g:"*রাত ৯টা। দরজার কলিংবেল বাজে। অফিস থেকে ক্লান্ত চেহারায় ঢোকে সাকিব, কিন্তু হাতে লুকিয়ে রাখা একটা প্যাকেট।*\n\nসরি সরি, আজকে অনেক দেরি হয়ে গেল। *ক্লান্ত কিন্তু হাসিমুখে* রাগ করোনি তো? দেখো তোমার জন্য কী এনেছি... তোমার প্রিয় ফুচকা! সারাদিন খেয়েছ তো ঠিকমতো?"}
];
const home=document.getElementById('home'),chatview=document.getElementById('chatview'),
chat=document.getElementById('chat'),f=document.getElementById('f'),t=document.getElementById('t'),
back=document.getElementById('back'),clearBtn=document.getElementById('clear'),title=document.getElementById('title');
const KEY='bc_hist_v3';
let hist={};let cur=null;
try{hist=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){hist={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(hist))}catch(e){}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function fmt(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*(.+?)\*/gs,'<em>$1</em>')}

CHARS.forEach(c=>{
  const d=document.createElement('div');d.className='card';
  d.innerHTML='<div class="e">'+c.e+'</div><div class="n">'+c.n+'</div><div class="r">'+c.r+'</div><div class="d">'+c.d+'</div>';
  d.onclick=()=>openChar(c);
  home.appendChild(d);
});
function add(text,cls){
  const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=fmt(text);
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;
}
function openChar(c){
  cur=c;
  if(!hist[c.id]||!hist[c.id].length){hist[c.id]=[{role:'model',text:c.g}];save();}
  home.style.display='none';chatview.style.display='flex';
  back.style.display='block';clearBtn.style.display='block';
  title.textContent=c.e+' '+c.n;chat.innerHTML='';
  hist[c.id].forEach(m=>add(m.text,m.role==='user'?'user':'bot'));
}
back.onclick=()=>{
  cur=null;chatview.style.display='none';home.style.display='grid';
  back.style.display='none';clearBtn.style.display='none';
  title.textContent='কার সাথে কথা বলবে?';
};
clearBtn.onclick=()=>{
  if(!cur||!confirm('গল্পটা নতুন করে শুরু করবে? আগের কথা মুছে যাবে।'))return;
  hist[cur.id]=[];save();openChar(cur);
};
async function ask(h){
  for(let i=0;i<2;i++){
    try{
      const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({character:cur.id,messages:h})});
      const data=await r.json();
      if(data.reply&&!data.busy)return data.reply;
    }catch(e){}
    await wait(2500);
  }
  return null;
}
f.addEventListener('submit',async e=>{
  e.preventDefault();
  const text=t.value.trim();if(!text||!cur)return;
  t.value='';const c=cur,h=hist[c.id];
  h.push({role:'user',text});save();add(text,'user');
  const w=add('*লিখছে...*','bot');
  const reply=await ask(h);
  if(reply){w.innerHTML=fmt(reply);h.push({role:'model',text:reply});save();}
  else{w.textContent='এখন সার্ভারে খুব ভিড়, কিছুক্ষণ পর আবার পাঠাও। 🙏';h.pop();save();}
});
</script>
</body>
</html>
