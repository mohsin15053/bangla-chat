<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>রাহাত - বাংলা চ্যাট</title>
<style>
  body{margin:0;font-family:sans-serif;background:#111;color:#eee;display:flex;flex-direction:column;height:100vh}
  header{padding:14px;background:#1c1c1c;font-weight:bold;text-align:center}
  #chat{flex:1;overflow-y:auto;padding:12px}
  .msg{max-width:80%;margin:8px 0;padding:10px 14px;border-radius:14px;line-height:1.5;white-space:pre-wrap}
  .user{background:#2563eb;margin-left:auto}
  .bot{background:#2a2a2a}
  form{display:flex;gap:8px;padding:10px;background:#1c1c1c}
  input{flex:1;padding:12px;border-radius:10px;border:0;font-size:16px}
  button{padding:12px 18px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:16px}
</style>
</head>
<body>
<header>🧑 রাহাত (তোমার ঢাকার বন্ধু)</header>
<div id="chat"><div class="msg bot">কী খবর দোস্ত? আজকে কেমন কাটছে? 😄</div></div>
<form id="f">
  <input id="t" placeholder="বাংলায় লেখো..." autocomplete="off">
  <button>পাঠাও</button>
</form>
<script>
const chat=document.getElementById('chat'),f=document.getElementById('f'),t=document.getElementById('t');
let history=[];
function add(text,cls){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
f.addEventListener('submit',async e=>{
  e.preventDefault();
  const text=t.value.trim(); if(!text) return;
  t.value=''; add(text,'user');
  history.push({role:'user',text});
  const wait=add('লিখছে...','bot');
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});
    const data=await r.json();
    wait.textContent=data.reply||'কিছু একটা সমস্যা হয়েছে।';
    history.push({role:'model',text:data.reply||''});
  }catch(err){wait.textContent='ইন্টারনেট সমস্যা, আবার চেষ্টা করো।'}
});
</script>
</body>
</html>
